services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brugali_costos
      POSTGRES_USER: brugali_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - brugali_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brugali_app -d brugali_costos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brugali_pgdata:

